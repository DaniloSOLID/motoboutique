# ============================================================
# Moto Boutique - Perfil PROD (producción)
# Todos los secretos llegan por variables de entorno del servidor.
# ============================================================

# Hostings como Render entregan el puerto en la variable PORT
server.port=${PORT:8081}

# Plantillas con caché
spring.thymeleaf.cache=true

# No exponer detalles internos al usuario
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Detrás de un proxy con HTTPS (Render, Nginx, etc.)
server.forward-headers-strategy=framework

# Cookie de sesión segura (requiere HTTPS: no probar este perfil por http://localhost)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Logs
logging.level.root=INFO
spring.jpa.show-sql=false