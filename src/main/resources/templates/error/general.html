<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · MotoButique|">Error · MotoButique</title>
    <!-- Página provisional: en la Fase 1 se rehace con los fragments y el modo oscuro. -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f6f5f3] text-[#1c1917] antialiased flex items-center justify-center p-6"
      style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
    <main class="w-full max-w-md rounded-xl border border-[#e7e5e4] bg-white p-8 text-center shadow-sm">
        <p class="text-5xl font-bold text-[#c2410c] tabular-nums" th:text="${codigo}">404</p>
        <h1 class="mt-3 text-xl font-semibold" th:text="${titulo}">Página no encontrada</h1>
        <p class="mt-2 text-sm text-[#57534e]" th:text="${detalle}">Detalle del error.</p>
        <p class="mt-4 text-xs text-[#57534e]" th:if="${referencia != null}">
            Referencia:
            <span class="font-mono font-semibold" th:text="${referencia}">ABC12345</span>
        </p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
            <a href="javascript:history.back()"
               class="rounded-lg border border-[#e7e5e4] px-4 py-2 text-sm font-medium hover:bg-[#f6f5f3]">
                Volver
            </a>
            <a th:href="@{/}"
               class="rounded-lg bg-[#c2410c] px-4 py-2 text-sm font-medium text-white hover:bg-[#ea580c]">
                Ir al inicio
            </a>
        </div>
    </main>
</body>
</html>
