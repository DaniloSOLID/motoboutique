# ============================================================
# Moto Boutique - Configuración común a todos los perfiles
# ============================================================
spring.application.name=motoboutique

# Perfil por defecto: dev (en producción se activa con SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Servidor
server.port=8081

# Idioma y codificación
spring.web.locale=es_PE
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Base de datos (PostgreSQL). La contraseña NO tiene valor por defecto a propósito:
# si falta, la aplicación no arranca y avisa claramente.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:motoboutique}
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA / Hibernate: el esquema lo manejan SOLO las migraciones Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false