# ============================================================
# Moto Boutique - Perfil DEV (desarrollo local)
# ============================================================

# Lee el archivo .env de la raíz del proyecto (si existe) con los secretos locales
spring.config.import=optional:file:.env[.properties]

# Mensajes de error detallados solo en desarrollo
server.error.include-message=always
server.error.include-binding-errors=always

# Logs
logging.level.root=INFO
logging.level.com.motoboutique=DEBUG
spring.jpa.show-sql=false